name: Suivi GDC - derniere ligne droite

# Couvre les 2 dernieres heures : 10 min jusqu'a -1h30, puis 5 min jusqu'a la
# bascule. Reprend le message Discord cree par suivi_matin.yml.
#
# Ici : 07h45 UTC = bascule (09h45 UTC) moins 2 heures.
on:
  schedule:
    - cron: "45 7 * * 5,6,0,1"     # vendredi, samedi, dimanche, lundi
  workflow_dispatch:

permissions:
  contents: write

jobs:
  suivi:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Pillow (rendu du tableau en image)
        run: pip install --quiet pillow

      - name: Suivi jusqu'a la bascule
        env:
          CR_API_TOKEN: ${{ secrets.CR_API_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          # Salon des joueurs a relancer : RELANCE s'il existe, sinon
          # CLASSEMENT, sinon le salon principal
          DISCORD_WEBHOOK_RELANCE: ${{ secrets.DISCORD_WEBHOOK_RELANCE }}
          DISCORD_WEBHOOK_CLASSEMENT: ${{ secrets.DISCORD_WEBHOOK_CLASSEMENT }}
        run: python simulateur.py

      - name: Memoriser le message
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add message_simulateur.json || true
          git commit -m "suivi final $(date -u +%F)" || exit 0
          git pull --rebase --autostash || true
          git push
